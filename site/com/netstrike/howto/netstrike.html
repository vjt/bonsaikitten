<!--

alert('Ricorda di disabilitare la cache \n Thou shalt disable your cache');


 var netstrikeincorso = false;
 var povero="";
 
 function start( url )
 {
	povero = url;
	netstrikeincorso = true;
	obiettivo.location = povero;
	setTimeout("ricarica()",5000);
 }
 
 function stop()
 {
	netstrikeincorso = false;
	loaded = false;
 }
 
 function ricarica()
 {
	if ( netstrikeincorso )
	{
	    obiettivo.location = povero;
	    setTimeout("ricarica()",5000);
	}
 }
 
// -->
